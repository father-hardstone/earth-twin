  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('error', (e) => {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:10px;left:10px;z-index:9999;background:red;color:white;padding:10px;font-family:monospace';
        d.textContent = e.message + ' at ' + e.filename + ':' + e.lineno;
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', (e) => {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:50px;left:10px;z-index:9999;background:red;color:white;padding:10px;font-family:monospace';
        d.textContent = 'Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        document.body.appendChild(d);
      });
    </script>
